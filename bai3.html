
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Shop điện thoại</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f2f2;
        }
        header {
            background: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px;
        }
        .product {
            background: white;
            width: 220px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }
        img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }
        button {
            background: green;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>SHOP ĐIỆN THOẠI</h1>
    <p>Chào mừng đến với cửa hàng</p>
</header>

<div class="container">

    <div class="product">
        <img src="https://placehold.co/200x150?text=Phone+1" alt="Điện thoại 1">
        <h3>Điện thoại A</h3>
        <p>5.000.000 VNĐ</p>
        <button onclick="them()">Thêm vào giỏ</button>
    </div>

    <div class="product">
        <img src="https://placehold.co/200x150?text=Phone+2" alt="Điện thoại 2">
        <h3>Điện thoại B</h3>
        <p>7.000.000 VNĐ</p>
        <button onclick="them()">Thêm vào giỏ</button>
    </div>

    <div class="product">
        <img src="https://placehold.co/200x150?text=Phone+3" alt="Điện thoại 3">
        <h3>Điện thoại C</h3>
        <p>9.000.000 VNĐ</p>
        <button onclick="them()">Thêm vào giỏ</button>
    </div>

</div>

<h3 style="text-align:center">
    Số sản phẩm trong giỏ: <span id="dem">0</span>
</h3>

<script>
    let soLuong = 0;

    function them() {
        soLuong++;
        document.getElementById("dem").innerHTML = soLuong;
    }
</script>

</body>
</html>
