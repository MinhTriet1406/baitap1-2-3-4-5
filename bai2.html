
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form đăng ký</title>
    <style>
        body {
            font-family: Arial;
            background: #eee;
        }
        form {
            background: white;
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 10px;
        }
        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }
        button {
            background: blue;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<form>
    <h2>ĐĂNG KÝ TÀI KHOẢN</h2>

    <label>Họ và tên:</label>
    <input type="text" placeholder="Nhập họ tên" required>

    <label>Email:</label>
    <input type="email" placeholder="Nhập email" required>

    <label>Mật khẩu:</label>
    <input type="password" placeholder="Nhập mật khẩu"
           minlength="6" required>

    <label>Ngày sinh:</label>
    <input type="date" required>

    <label>Giới tính:</label><br>
    <input type="radio" name="gioitinh" required> Nam
    <input type="radio" name="gioitinh"> Nữ

    <br><br>
    <button type="submit">Đăng ký</button>
</form>

</body>
</html>
